
[package]
name = "clap_doc_generator"
version = "0.4.4"
edition = "2024"
description = "Automatically generate CLI documentation from clap definitions and update readme files"
readme = "readme.md"
repository = "https://github.com/HBDE-work/clap_doc_generator/tree/master"
license = "MIT"
keywords = ["cli", "documentation", "clap"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "LICENSE", "./readme.md"]

[lib]
name = "clapdocs"
path = "src/core/lib.rs"

[[bin]]
name = "clapdocs"
path = "src/cli/main.rs"

[features]
default = ["markdown"]
markdown = []
jenkins = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.1+spec-1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
ignore = "0.4.34"
syn = { version = "3.0.10", features = ["full", "extra-traits"] }
quote = "1.0.47"
